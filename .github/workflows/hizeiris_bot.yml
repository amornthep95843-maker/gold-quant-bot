{"name": "Hizeiris Gold Quant Bot (Mon 06:00 - Sat 05:00 TH)", "on": {"schedule": [{"cron": "4 23 * * 0-4"}, {"cron": "4 2,5,8,11,14,17,20 * * 1-5"}], "workflow_dispatch": {}}, "concurrency": {"group": "hizeiris-quant-bot-runner", "cancel-in-progress": false}, "permissions": {"contents": "write"}, "jobs": {"run-quant-bot": {"runs-on": "ubuntu-latest", "timeout-minutes": 210, "steps": [{"name": "Checkout repository", "uses": "actions/checkout@v4"}, {"name": "Set up Python 3.11", "uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}}, {"name": "Install dependencies & Chromium", "run": "pip install playwright requests matplotlib Pillow\nplaywright install --with-deps chromium\nsudo apt-get update && sudo apt-get install -y fonts-tlwg-loma-otf fonts-noto-core fonts-noto-cjk\n"}, {"name": "Unpack and Run Hizeiris Quant Bot", "env": {"TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}", "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}", "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}", "BOT_B64": ""}, "run": "python3 -c \"import os, zlib, base64; open('hizeiris_auto_bot.py', 'wb').write(zlib.decompress(base64.b64decode(os.environ['BOT_B64'])))\"\ngit config user.name \"Hizeiris Quant Bot\"\ngit config user.email \"bot@noreply.github.com\"\npython3 hizeiris_auto_bot.py\n"}]}}}
