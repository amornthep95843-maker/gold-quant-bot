{
  "name": "Hizeiris Quant Bot (Every 30m)",
  "on": {
    "schedule": [
      {"cron": "0 */3 * * *"}
    ],
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "hizeiris-quant-bot-single-runner",
    "cancel-in-progress": false
  },
  "jobs": {
    "run-quant-bot": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 200,
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up Python 3.11",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install Thai Fonts & Dependencies",
          "run": "sudo apt-get update && sudo apt-get install -y fonts-thai-tlwg fonts-noto-core fontconfig || true\nfc-cache -fv || true\npip install playwright requests pillow\nplaywright install --with-deps chromium\n"
        },
        {
          "name": "Unpack and Run Hizeiris Quant Bot",
          "env": {
            "TZ": "Asia/Bangkok",
            "PYTHONUNBUFFERED": "1",
            "MAX_ROUNDS_PER_JOB": "6",
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
            "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
            "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}"
          },
          "run": "python3 -c \"import base64, gzip; open('hizeiris_auto_bot.py', 'wb').write(gzip.decompress(base64.b64decode('')))\"\npython3 -u hizeiris_auto_bot.py\n"
        }
      ]
    }
  }
}
