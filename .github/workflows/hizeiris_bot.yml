{
"name": "Hizeiris Gold Quant Bot (Every 30 Mins)",
"on": {
"schedule": [
{
"cron": "*/30 * * * *"
}
],
"workflow_dispatch": null
},
"permissions": {
"contents": "write"
},
"jobs": {
"run-quant-bot": {
"runs-on": "ubuntu-latest",
"timeout-minutes": 15,
"steps": [
{
"name": "Checkout repository",
"uses": "actions/checkout@v4"
},
{
"name": "Set up Python 3.11",
"uses": "actions/setup-python@v5",
"with": {
"python-version": "3.11"
}
},
{
"name": "Install Thai Fonts, dependencies & Chromium",
"run": "(sudo apt-get update && sudo apt-get install -y fonts-thai-tlwg fonts-noto-core fontconfig && sudo fc-cache -fv || true) && pip install --upgrade pip && pip install playwright google-genai requests pillow && playwright install chromium"
},
{
"name": "Run Hizeiris Quant Bot",
"env": {
"PYTHONUNBUFFERED": "1",
"GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
"TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
"TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}",
"FALLBACK_DIFF": "5.0"
},
"run": "python3 -c \"import base64, gzip; open('hizeiris_auto_bot.py', 'wb').write(gzip.decompress(base64.b64decode('')))\" && python3 -u hizeiris_auto_bot.py"
},
{
"name": "Save session_state.json for next round",
"run": "git config --local user.email \"bot@github.com\" && git config --local user.name \"Hizeiris Quant Bot\" && if [ -f session_state.json ]; then git add session_state.json hizeiris_auto_bot.py && (git diff --staged --quiet || git commit -m \"Auto-update session_state.json [skip ci]\") && (git push || true); fi"
}
]
}
}
}
